name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  BUILD_TYPE: Debug
  CC: clang
  CXX: clang++

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          clang \
          llvm \
          libncurses5-dev \
          libncursesw5-dev \
          libspdlog-dev \
          libgtest-dev \
          libgmock-dev \
          clang-tidy \
          cppcheck \
          lcov \
          gcovr

    - name: Configure CMake
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DBUILD_TESTING=ON \
          -DENABLE_COVERAGE=ON

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}}

    - name: Run Tests
      working-directory: build
      run: ctest --output-on-failure --verbose

    - name: Generate Coverage Report
      if: success()
      working-directory: build
      run: |
        printf '#!/bin/sh\nexec llvm-cov gcov "$@"\n' > /tmp/llvm-gcov.sh
        chmod +x /tmp/llvm-gcov.sh
        lcov --directory . --capture --output-file coverage.info \
          --gcov-tool /tmp/llvm-gcov.sh \
          --ignore-errors mismatch
        lcov --remove coverage.info '/usr/*' '*/tests/*' --output-file coverage.info \
          --ignore-errors mismatch
        lcov --list coverage.info

    - name: Upload Coverage to Codecov
      if: success()
      uses: codecov/codecov-action@v4
      with:
        files: ./build/coverage.info
        fail_ci_if_error: false

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          clang \
          libncurses5-dev \
          libncursesw5-dev \
          libspdlog-dev \
          clang-tidy \
          cppcheck

    - name: Run clang-tidy
      run: |
        cmake -B build -G Ninja -DENABLE_CLANG_TIDY=ON
        cmake --build build 2>&1 | tee clang-tidy-output.txt
      continue-on-error: true

    - name: Run cppcheck
      run: |
        cppcheck --enable=all \
          --suppress=missingIncludeSystem \
          --suppress=unmatchedSuppression \
          --inline-suppr \
          --error-exitcode=0 \
          --xml \
          --xml-version=2 \
          src/ include/ 2> cppcheck-report.xml
      continue-on-error: true

  format-check:
    name: Code Formatting Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format
      run: sudo apt-get update && sudo apt-get install -y clang-format

    - name: Run clang-format
      run: |
        find src include tests -name '*.cpp' -o -name '*.hpp' -o -name '*.h' | \
        xargs clang-format --dry-run --Werror

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest

    strategy:
      matrix:
        sanitizer: [address, undefined]

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          clang \
          libncurses5-dev \
          libncursesw5-dev \
          libspdlog-dev \
          libgtest-dev \
          libgmock-dev

    - name: Configure CMake with Sanitizers
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTING=ON \
          -DENABLE_SANITIZERS=ON

    - name: Build
      run: cmake --build build

    - name: Run Tests with Sanitizers
      working-directory: build
      env:
        ASAN_OPTIONS: check_initialization_order=1:detect_stack_use_after_return=1
        UBSAN_OPTIONS: print_stacktrace=1
      run: ctest --output-on-failure --verbose
